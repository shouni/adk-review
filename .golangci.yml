version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    # The following are additions matched to what adk-review handles.
    # It handles SSH private keys, OAuth session encryption keys, signed URLs and clones
    # of external repositories, so the security linter cannot be dropped (it also catches
    # a missing http.Server timeout).
    - gosec
    # Errors rely on %w wrapping and errors.Is/As throughout. This linter is the only
    # one that finds == comparisons and misuse of %v.
    - errorlint
    # Since errcheck excludes (io.ReadCloser).Close, nothing else watches for an
    # unclosed response body.
    - bodyclose
    # The design is built around the three-tier timeout, so an HTTP call without a
    # context slips past it.
    - noctx
    - copyloopvar
    - unconvert
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
    gosec:
      excludes:
        # G104 duplicates errcheck, so it is disabled.
        - G104
  exclusions:
    rules:
      # httptest.NewRequest without a context is the idiom in tests, and fixing
      # it here would not make a single production call safer.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
