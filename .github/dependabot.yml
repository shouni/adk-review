# The reason for each setting is in the shouni/workflows README, "Dependabot conventions".
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # The Dockerfile's base image. **It is built by cloudbuild.yaml, so CI never sees it**,
  # and nobody would bump it unless it is tracked. `FROM scratch` is out of Dependabot's scope.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
