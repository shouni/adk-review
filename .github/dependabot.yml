# 各設定の理由は shouni/workflows の README「Dependabot の規約」にある。
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Dockerfile のベースイメージ。**cloudbuild.yaml でビルドしているので CI には出ない**が、
  # 追跡しないと誰も上げない。`FROM scratch` は Dependabot の対象外。
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
